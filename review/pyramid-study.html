#afe-pyramid-study{--paper:#f7f7f1;--ink:#162d2c;--secondary:#495e59;--rule:#ccd3c8;--accent:#286159;box-sizing:border-box;container:afe / inline-size;position:relative;max-width:1440px;margin-inline:auto;background:var(--paper);color:var(--ink);font:16px/1.5 "Instrument Sans",Arial,Helvetica,sans-serif;color-scheme:light;text-align:left}
#afe-pyramid-study *{box-sizing:border-box}
#afe-pyramid-study [hidden]{display:none!important}
#afe-pyramid-study button,#afe-pyramid-study select{font:inherit;color:inherit;cursor:pointer}
#afe-pyramid-study button:focus-visible,#afe-pyramid-study select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#afe-pyramid-study .afe-mast,#afe-pyramid-study .afe-tools{margin:0 4.8%;display:flex;align-items:center;justify-content:space-between;gap:16px}
#afe-pyramid-study .afe-mast{min-height:63px;border-bottom:1px solid var(--rule)}
#afe-pyramid-study .afe-wordmark{display:flex;gap:17px;align-items:center;font:600 19px/1 Arial,sans-serif;letter-spacing:-1.25px}
#afe-pyramid-study .afe-wordmark span{padding-left:16px;border-left:1px solid #b5c0b7;font:400 13px/1.1 Arial,sans-serif;letter-spacing:.01em;color:var(--secondary)}
#afe-pyramid-study .afe-motion,#afe-pyramid-study .afe-back{border:0;background:transparent;padding:8px 0;font-size:13px;color:var(--secondary)}
#afe-pyramid-study .afe-motion::before{display:inline-block;content:"Ⅱ";width:19px;color:var(--accent);font-weight:700}
#afe-pyramid-study .afe-motion[aria-pressed=true]::before{content:"▷"}
#afe-pyramid-study .afe-motion:disabled{visibility:hidden}
#afe-pyramid-study .afe-spread{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;padding:16px 3% 10px 6.5%;gap:2%;min-height:clamp(410px,45cqi,578px)}
#afe-pyramid-study .afe-copy{min-width:0;position:relative}
#afe-pyramid-study .afe-outgoing{position:absolute;pointer-events:none;margin:0}
#afe-pyramid-study h1,#afe-pyramid-study h2,#afe-pyramid-study h3,#afe-pyramid-study p,#afe-pyramid-study figure{margin:0}
#afe-pyramid-study h1,#afe-pyramid-study h2,#afe-pyramid-study h3{font-family:AFEInstrument,Baskerville,Georgia,serif;font-weight:400}
#afe-pyramid-study h1{font-size:clamp(64px,8.8cqi,123px);line-height:.90;letter-spacing:-.038em}
#afe-pyramid-study .afe-intro>p{max-width:36ch;margin-top:24px;color:var(--secondary);font-size:clamp(15px,1.58cqi,21px);line-height:1.52}
#afe-pyramid-study .afe-figure{display:flex;flex-direction:column;align-items:stretch;min-width:0}
#afe-pyramid-study canvas{display:block;width:100%;aspect-ratio:1.34;touch-action:pan-y}
#afe-pyramid-study figcaption{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:2px 5% 0;gap:3px;color:var(--secondary);font-size:13px;line-height:1.4}
#afe-pyramid-study figcaption strong{color:var(--ink);font-weight:600}
#afe-pyramid-study .afe-keys{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:6px}
#afe-pyramid-study .afe-keys span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font:12px/1.3 Arial,sans-serif}
#afe-pyramid-study .afe-keys i{width:8px;height:8px;border-radius:1px;background:#558f82}
#afe-pyramid-study .afe-keys span:nth-child(2) i{background:#7391ae}
#afe-pyramid-study .afe-keys span:nth-child(3) i{background:#bd9b60}
#afe-pyramid-study .afe-detail{max-width:45ch;padding:7px 0}
#afe-pyramid-study .afe-back{display:block;margin-bottom:12px;color:var(--accent)}
#afe-pyramid-study .afe-back:hover{text-decoration:underline}
#afe-pyramid-study .afe-level,#afe-pyramid-study .afe-task small{display:block;font:500 11px/1.5 ui-monospace,"SFMono-Regular",Consolas,monospace;letter-spacing:.063em;text-transform:uppercase;color:var(--secondary)}
#afe-pyramid-study h2{font-size:clamp(41px,5.2cqi,72px);line-height:1.04;letter-spacing:-.025em;margin:4px 0 10px}
#afe-pyramid-study .afe-definition{color:var(--secondary);font-size:clamp(15px,1.42cqi,18px);line-height:1.43}
#afe-pyramid-study .afe-task{margin-top:19px;padding:14px 16px 16px;border:1px solid var(--rule);border-left:3px solid var(--task-color,#5a8d80);background:#fdfdf8}
#afe-pyramid-study h3{font-size:clamp(24px,2.65cqi,35px);line-height:1.08;margin:6px 0 7px;letter-spacing:-.015em}
#afe-pyramid-study .afe-task p{font:14px/1.45 Arial,sans-serif;color:var(--secondary)}
#afe-pyramid-study .afe-tools{border-top:1px solid var(--rule);padding:14px 0 18px}
#afe-pyramid-study .afe-views{display:flex;gap:3px;flex-wrap:wrap}
#afe-pyramid-study .afe-views button{border:0;background:transparent;border-radius:3px;padding:8px 11px;font-size:13px}
#afe-pyramid-study .afe-views [aria-pressed=true]{background:var(--ink);color:var(--paper)}
#afe-pyramid-study .afe-views button:hover:not([aria-pressed=true]){background:#e8ede3}
#afe-pyramid-study .afe-picker{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--secondary)}
#afe-pyramid-study select{font-size:13px;padding:7px 4px 7px 8px;max-width:190px;border:1px solid #b8c5ba;border-radius:3px;background:#fafbf6}
#afe-pyramid-study .afe-live{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
@container afe (max-width:660px){
  #afe-pyramid-study .afe-mast{min-height:50px}
  #afe-pyramid-study .afe-spread{display:flex;flex-direction:column;align-items:stretch;min-height:0;padding:26px 5% 6px;gap:4px}
  #afe-pyramid-study h1{font-size:clamp(52px,11.6cqi,74px)}
  #afe-pyramid-study .afe-intro>p{margin-top:13px;font-size:15px;max-width:42ch}
  #afe-pyramid-study canvas{aspect-ratio:1.65;max-height:310px}
  #afe-pyramid-study figcaption{min-height:40px;padding:0 2%;font-size:12px}
  #afe-pyramid-study .afe-detail{max-width:100%}
  #afe-pyramid-study .afe-back{margin-bottom:5px}
  #afe-pyramid-study h2{font-size:42px}
  #afe-pyramid-study .afe-tools{gap:4px 12px;flex-wrap:wrap}
  #afe-pyramid-study .afe-picker{flex-wrap:wrap}
}
@media(pointer:coarse){#afe-pyramid-study button,#afe-pyramid-study select{min-height:44px}}

  const colors = ['#91b4a9','#70a9a0','#5b958b','#91b2a6','#77aaa0','#578e85','#a1baaa','#93acc1','#6e91ac','#839caf','#a3b6c7','#c2a267'];
