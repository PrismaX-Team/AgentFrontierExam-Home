#afe-pyramid-study {
  --paper: #f6f4ed;
  --ink: #202724;
  --muted: #45514b;
  --line: #c8cbc1;
  container: afe / inline-size;
  position: relative;
  isolation: isolate;
  max-width: 1500px;
  margin-inline: auto;
  background-color: var(--paper);
  background-image: var(--paper-grain, none);
  background-size: 256px 256px;
  color: var(--ink);
  color-scheme: light;
  font: 16px/1.5 "Helvetica Neue", Arial, sans-serif;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
#afe-pyramid-study *, #afe-pyramid-study { box-sizing: border-box; }
#afe-pyramid-study [hidden] { display: none !important; }
#afe-pyramid-study :is(h1,h2,h3,p,figure) { margin: 0; }
#afe-pyramid-study button {
  appearance: none;
  border: 0;
  color: inherit;
  font: inherit;
  background: transparent;
  cursor: pointer;
}
#afe-pyramid-study button:focus-visible { outline: 2px solid #316561; outline-offset: 4px; border-radius: 2px; }
#afe-pyramid-study .mast {
  display: flex;
  align-items: baseline;
  gap: 15px;
  margin-inline: 6.2%;
  padding-top: clamp(22px, 3.5cqi, 48px);
}
#afe-pyramid-study .wordmark { padding: 0; font-size: 21px; line-height: 1; font-weight: 600; letter-spacing: -.08em; }
#afe-pyramid-study .mast-title { font-size: 13px; letter-spacing: .013em; color: var(--muted); }
#afe-pyramid-study .spread {
  display: grid;
  grid-template-columns: minmax(0,.76fr) minmax(0,1.24fr);
  align-items: center;
  gap: 2.1%;
  min-height: clamp(435px, 47.5cqi, 680px);
  padding: 8px 2.4% clamp(24px, 3.6cqi, 52px) 6.2%;
}
#afe-pyramid-study .copy { position: relative; z-index: 1; min-width: 0; }
#afe-pyramid-study :is(h1,h2,h3) {
  font: 400 1em/1 AFEInstrument, Baskerville, Georgia, serif;
  font-kerning: normal;
}
#afe-pyramid-study h1 {
  font-size: clamp(48px,7.1cqi,106px);
  letter-spacing: -.032em;
  line-height: .96;
}
#afe-pyramid-study h1 span { white-space: nowrap; }
#afe-pyramid-study h1 em { font-family: inherit; font-weight: 400; font-style: italic; font-size: .985em; letter-spacing: -.03em; margin-right: .024em; }
#afe-pyramid-study .intro > p {
  max-width: 34ch;
  margin-top: clamp(18px,1.9cqi,28px);
  color: var(--muted);
  font-size: clamp(16px,1.58cqi,23px);
  line-height: 1.46;
}
#afe-pyramid-study .intro > p span { display: inline-block; max-width: 100%; }
@container afe (min-width:661px) and (max-width:940px) {
  #afe-pyramid-study .intro > p span { display: inline; }
}
#afe-pyramid-study .detail { max-width: 44ch; padding-block: 9px; }
#afe-pyramid-study .back, #afe-pyramid-study .whole {
  padding: 5px 0;
  font-size: 13px;
  color: var(--muted);
}
#afe-pyramid-study .back { margin-bottom: clamp(10px,1.5cqi,19px); }
#afe-pyramid-study :is(.back,.whole):hover { text-decoration: underline; text-underline-offset: 4px; }
#afe-pyramid-study .level-name, #afe-pyramid-study .task small {
  display: block;
  font: 500 11px/1.4 ui-monospace, "SFMono-Regular", Consolas, monospace;
  letter-spacing: .095em;
  text-transform: uppercase;
  color: var(--muted);
}
#afe-pyramid-study h2 {
  margin-block: 7px 12px;
  font-size: clamp(37px,4.8cqi,70px);
  line-height: .99;
  letter-spacing: -.025em;
  text-wrap: balance;
}
#afe-pyramid-study .definition { max-width: 35ch; font-size: clamp(15px,1.35cqi,18px); line-height: 1.48; color: var(--muted); }
#afe-pyramid-study .task { margin-top: clamp(16px,2.1cqi,28px); padding-top: 16px; border-top: 1px solid var(--line); }
#afe-pyramid-study h3 { margin-block: 8px; font-size: clamp(25px,2.55cqi,38px); letter-spacing: -.012em; line-height: 1.08; }
#afe-pyramid-study .task p { max-width: 46ch; font-size: 14px; line-height: 1.51; color: var(--muted); }
#afe-pyramid-study .plate { position: relative; min-width: 0; width: 100%; }
#afe-pyramid-study canvas { display: block; width: 100%; aspect-ratio: 1.20; touch-action: pan-y; }
#afe-pyramid-study .layer-labels button, #afe-pyramid-study .facet-keys button {
  position: absolute;
  min-width: 39px;
  height: 38px;
  padding: 0 3px;
  transform: translate(-50%,-50%);
}
#afe-pyramid-study .layer-labels button {
  display: flex;
  align-items: center;
  gap: 6px;
  font: 12px/1 ui-monospace, "SFMono-Regular", Consolas, monospace;
  letter-spacing: .015em;
  color: #4b5753;
}
#afe-pyramid-study .layer-labels button::before { content: ""; width: 13px; border-top: 1px solid #a5ada7; }
#afe-pyramid-study .layer-labels button:is(:hover,:focus-visible) { color: #173f3e; }
#afe-pyramid-study .layer-labels button:is(:hover,:focus-visible)::before { border-color: currentColor; }
#afe-pyramid-study .facet-keys button { width: 42px; height: 42px; padding: 0; border-radius: 50%; }
#afe-pyramid-study .facet-keys button:focus-visible { outline: 2px solid #164e50; outline-offset: -1px; border-radius: 50%; }
#afe-pyramid-study .whole { position: absolute; left: 6%; top: 4%; }
#afe-pyramid-study .motion {
  position: absolute;
  right: 1%;
  top: 3%;
  width: 34px;
  height: 34px;
  padding: 0;
  display: grid;
  place-items: center;
  color: #5d6560;
}
#afe-pyramid-study .motion span { width: 7px; height: 10px; border-inline: 2px solid currentColor; }
#afe-pyramid-study .motion[aria-pressed=true] span { width: 0; height: 0; border: 5px solid transparent; border-right: 0; border-left: 8px solid currentColor; }
#afe-pyramid-study .motion:is(:hover,:focus-visible) { color: #1f3b37; }
#afe-pyramid-study .object-note {
  position: absolute;
  z-index: 2;
  max-width: min(238px,76%);
  padding: 10px 13px 11px;
  border-left: 1px solid #84938d;
  background: var(--paper);
  pointer-events: none;
  font-size: 12px;
  line-height: 1.38;
  color: var(--muted);
  text-wrap: pretty;
}
#afe-pyramid-study .object-note strong { display: block; margin-bottom: 3px; font-size: 13px; font-weight: 600; color: var(--ink); }
#afe-pyramid-study .live { position: absolute; clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; }
@container afe (max-width:660px) {
  #afe-pyramid-study .mast { padding-top: 18px; margin-inline: 7%; gap: 12px; }
  #afe-pyramid-study .spread { display: flex; flex-direction: column; align-items: stretch; min-height: 0; padding: 28px 2% 14px; gap: 12px; }
  #afe-pyramid-study .copy { margin-inline: 5.15%; }
  #afe-pyramid-study h1 { font-size: clamp(48px,12.3cqi,72px); }
  #afe-pyramid-study .intro > p { margin-top: 15px; max-width: 35ch; font-size: clamp(16px,3.6cqi,18px); }
  #afe-pyramid-study canvas { aspect-ratio: 1.22; max-height: 410px; }
  #afe-pyramid-study .detail { padding-block: 0; }
  #afe-pyramid-study .back { margin-bottom: 5px; }
  #afe-pyramid-study h2 { font-size: 41px; }
  #afe-pyramid-study .task { padding-top: 12px; }
}
@media(pointer:coarse) {
  #afe-pyramid-study button { min-width: 44px; min-height: 44px; }
  #afe-pyramid-study .facet-keys button, #afe-pyramid-study .layer-labels button { width: 44px; height: 44px; }
}

  const frost=ctx?.createPattern(makeGrain(128,179109,null),'repeat');
  const paperColor=getComputedStyle(root).backgroundColor.match(/\d+/g).map(Number);
  const paperImage='url("'+makeGrain(256,10273,paperColor).toDataURL()+'")';
  root.style.setProperty('--paper-grain',paperImage);
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  const levels=['','Scientific workflows','Scientific breakthroughs','Major scientific breakthroughs'];
  const labels=Array.from(root.querySelectorAll('[data-level]'));
  const note=ui('.object-note'),keys=ui('.facet-keys'),motion=ui('.motion');
  let yaw=-.59,view=0,section=1,cut=0,lift=0,hovered=-1,selected=-1,pointedLevel=0;
  let paused=reduced.matches,visible=true,width=0,height=0,frame=0,lastTime=0,hits=[];
  const pops=shapes.map(()=>0);

    document.head.append(meta);
  }
  if(location.protocol==='file:') {
    document.title='Agent Frontier Exam · Taskonomy';
    document.body.style.margin='0';
    document.body.style.backgroundColor=getComputedStyle(root).backgroundColor;
    document.body.style.backgroundImage=paperImage;
    document.body.style.backgroundSize='256px 256px';
  }
  const buttons=shapes.map((shape,index)=>{
    const button=document.createElement('button');
    button.type='button';
    const sample=samples[index];
    button.setAttribute('aria-label',sample[0]+' · '+sample[3]);
    button.addEventListener('click',()=>choose(index));
    button.addEventListener('focus',()=>{
      if(button.matches(':focus-visible')) previewPiece(index,buttonPosition(button));
    });
    button.addEventListener('blur',clearPreview);
    button.addEventListener('pointerenter',event=>{

  });
  function save() {
    const meaning={level:selected<0?null:tierOf(selected),task:selected<0?null:samples[selected][3]};
    window.openai?.setWidgetState?.({modelContent:meaning,privateContent:{selected,view,paused}})?.catch(()=>{});
  }
  function setCopy(animate=false) {
    const active=selected>=0, intro=ui('.intro'),detail=ui('.detail');
    intro.hidden=active;detail.hidden=!active;
    if(active) {
      const [category,description,domain,title,body]=samples[selected],level=tierOf(selected);
      ui('.level-name').textContent='L'+level+' / '+(level===1?'Scientific workflows':'AFE-research');
      ui('h2').textContent=category;
      ui('.definition').textContent=description;
      ui('.task small').textContent=(level===1?'Example brief · ':'')+domain;
      ui('h3').textContent=title;ui('.task p').textContent=body;
      ui('.live').textContent=category+'. '+title;
    } else if(animate) ui('.live').textContent='Agent Frontier Exam overview';
    if(animate && !reduced.matches) {
      const target=active?detail:intro;
      target.getAnimations().forEach(animation=>animation.cancel());
      target.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:220,easing:'ease-out'});
    }

    ui('.whole').hidden=!view;

    motion.setAttribute('aria-pressed',String(paused));
    motion.setAttribute('aria-label',paused?'Resume rotation':'Pause rotation');
    keys.hidden=!view;
    buttons.forEach((button,index)=>{button.hidden=tierOf(index)!==view;});
  }
  function choose(index) {

    ui('.back').focus({preventScroll:true});save();wake();
  }
  function openSection(level,keyboard) {
    clearPreview();
    if(level===3) {choose(11);return;}
    if(section!==level) cut=0;
    view=section=level;selected=-1;
    setCopy();draw();save();wake();
    const focusTarget=keyboard?buttons.find((button,index)=>tierOf(index)===level):ui('.whole');
    focusTarget.focus({preventScroll:true});
  }
  function reset(returnFocus=false) {
    const former=view||(selected>=0?tierOf(selected):0);
    const hadCard=selected>=0;
    clearPreview();selected=-1;view=0;
    setCopy(hadCard);save();wake();
    if(returnFocus && former) labels.find(button=>Number(button.dataset.level)===former).focus({preventScroll:true});
  }
  function buttonPosition(button) {
    const a=button.getBoundingClientRect(),b=canvas.getBoundingClientRect();
    return {x:a.left-b.left+a.width/2,y:a.top-b.top+a.height/2};
  }
  function displayNote(name,description,point) {

      note.firstElementChild.textContent=name;note.lastElementChild.textContent=description;
    }

    note.style.left=clamp(x,5,width-nw-5)+'px';
    note.style.top=clamp(point.y-nh-10,6,height-nh-6)+'px';
  }
  function previewPiece(index,point) {
    hovered=index;pointedLevel=0;
    if(index<0) {clearPreview();return;}
    displayNote('L'+tierOf(index)+' · '+samples[index][0],samples[index][1],point);
    wake();
  }
  function previewLevel(level,button) {
    hovered=-1;pointedLevel=level;
    const action=level===3?'Open the example task.':'Explore this cross-section.';
    displayNote('L'+level+' · '+levels[level],action,buttonPosition(button));
    wake();
  }
  function clearPreview() {
    hovered=-1;pointedLevel=0;note.hidden=true;wake();
  }
  function positionButton(button,x,y) {
    button.style.left=x.toFixed(1)+'px';button.style.top=y.toFixed(1)+'px';
  }
  function draw() {
    if(!width||!height) return;
    const cam=camera(width,height,yaw,cut,lift), state={cut,section,lift,pops};
    const pieces=shapes.map((shape,index)=>mesh(index,cam,state)).filter(Boolean);
    pieces.sort((a,b)=>a.level-b.level||dot(a.center3,cam.eye)-dot(b.center3,cam.eye));

        const level=Number(button.dataset.level),y=[0,.24,.81,1.43][level];
